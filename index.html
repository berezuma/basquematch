<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Euskara Egunero</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --border:#e5e5ea;
  --border-light:#f0f0f3;
  --correct:#34c759;
  --correct-bg:#ecfaf0;
  --correct-border:#b8e9c4;
  --error:#ff3b30;
  --error-bg:#fef0ef;
  --error-border:#f5c6c3;
  --accent:#1d1d1f;
  --accent-secondary:#6e6e73;
  --text:#1d1d1f;
  --text-secondary:#86868b;
  --text-tertiary:#aeaeb2;
  --selected:#007aff;
  --selected-bg:#eef4ff;
  --selected-border:#bdd5fc;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
  --shadow-lg:0 12px 40px rgba(0,0,0,.12);
  --radius:14px;
  --radius-sm:10px;
  --transition:.2s ease;
}
html{height:100%}
body{
  min-height:100vh;min-height:100dvh;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;display:flex;flex-direction:column;
}

/* ========== HEADER ========== */
.header{
  padding:20px 20px 0;display:flex;align-items:center;
  justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:36px;height:36px;border-radius:10px;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.9rem;letter-spacing:-.5px;
}
.brand h1{font-size:1.15rem;font-weight:700;color:var(--accent);letter-spacing:-.3px}
.header-meta{
  font-size:.75rem;font-weight:500;color:var(--text-tertiary);
  letter-spacing:-.1px;
}

/* ========== LANG SELECTOR ========== */
.lang-bar{display:flex;gap:6px;padding:16px 20px 0}
.lang-btn{
  flex:1;border:1.5px solid var(--border);background:var(--surface);
  color:var(--text-secondary);font-family:inherit;
  font-size:.8rem;font-weight:600;padding:9px 0;
  border-radius:var(--radius-sm);cursor:pointer;
  transition:var(--transition);touch-action:manipulation;
}
.lang-btn.active{
  background:var(--accent);color:#fff;
  border-color:var(--accent);
}

/* ========== STATUS BAR ========== */
.status-bar{
  display:flex;gap:8px;padding:12px 20px 0;
}
.stat-card{
  flex:1;background:var(--surface);border:1px solid var(--border-light);
  border-radius:var(--radius-sm);padding:10px 12px;
  display:flex;flex-direction:column;gap:2px;
}
.stat-label{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-tertiary)}
.stat-value{font-size:1.1rem;font-weight:700;color:var(--accent);letter-spacing:-.3px}

/* ========== GAME BOARD ========== */
.board{
  flex:1;display:flex;gap:8px;padding:12px 12px 0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.col{flex:1;display:flex;flex-direction:column;gap:6px}
.col-header{
  font-size:.65rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:var(--text-tertiary);text-align:center;
  padding:0 0 4px;
}
.tile{
  position:relative;padding:13px 8px;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  text-align:center;font-size:.85rem;font-weight:600;
  color:var(--text);letter-spacing:-.1px;
  cursor:pointer;transition:all .2s ease;
  user-select:none;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;
  min-height:46px;word-break:break-word;line-height:1.25;
}
.tile:active{transform:scale(.97)}
.tile.selected{
  border-color:var(--selected);background:var(--selected-bg);
  color:var(--selected);box-shadow:0 0 0 3px rgba(0,122,255,.12);
}
.tile.matched{
  background:var(--correct-bg);border-color:var(--correct-border);
  color:var(--correct);cursor:default;pointer-events:none;
}
.tile.wrong{
  background:var(--error-bg);border-color:var(--error-border);
  color:var(--error);animation:shake .35s ease;
}
.tile.disabled{pointer-events:none;opacity:.4}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-3px)}
  75%{transform:translateX(3px)}
}

/* ========== PROGRESS BAR ========== */
.progress-track{
  display:flex;gap:4px;padding:10px 20px 16px;justify-content:center;
}
.pip{
  width:100%;max-width:28px;height:4px;border-radius:2px;
  background:var(--border);transition:background .3s ease;
}
.pip.ok{background:var(--correct)}
.pip.miss{background:var(--error)}

/* ========== COMPLETED STATE ========== */
.completed-overlay{
  position:absolute;inset:0;background:rgba(245,245,247,.85);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  z-index:10;border-radius:var(--radius);
}
.completed-msg{
  text-align:center;padding:20px;
}
.completed-msg p{font-size:.9rem;font-weight:600;color:var(--text);margin-bottom:4px}
.completed-msg span{font-size:.8rem;color:var(--text-secondary)}

/* ========== MODAL OVERLAY ========== */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.3);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:100;opacity:0;pointer-events:none;
  transition:opacity .25s ease;
  padding:0 0 env(safe-area-inset-bottom,0);
}
.overlay.show{opacity:1;pointer-events:auto}
.modal{
  background:var(--surface);
  border-radius:20px 20px 0 0;
  padding:8px 24px 32px;max-width:480px;width:100%;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);
}
.overlay.show .modal{transform:translateY(0)}
.modal-handle{
  width:36px;height:4px;border-radius:2px;
  background:var(--border);margin:0 auto 20px;
}

.modal-title{font-size:1.3rem;font-weight:800;text-align:center;letter-spacing:-.4px;margin-bottom:2px}
.modal-sub{font-size:.8rem;color:var(--text-secondary);text-align:center;font-weight:500;margin-bottom:20px}

.result-grid{display:flex;gap:12px;margin-bottom:20px}
.result-card{
  flex:1;background:var(--bg);border-radius:var(--radius-sm);
  padding:14px 8px;text-align:center;
}
.result-card .num{font-size:1.5rem;font-weight:800;color:var(--accent);letter-spacing:-.5px}
.result-card .lbl{font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-tertiary);margin-top:2px}

.result-sequence{
  display:flex;gap:3px;justify-content:center;margin-bottom:24px;
}
.seq-pip{width:20px;height:6px;border-radius:3px}
.seq-pip.ok{background:var(--correct)}
.seq-pip.miss{background:var(--error)}

/* Tomorrow countdown */
.tomorrow-section{
  text-align:center;padding:16px 0 20px;
  border-top:1px solid var(--border-light);margin-bottom:4px;
}
.tomorrow-label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-tertiary);margin-bottom:6px}
.tomorrow-timer{font-size:1.6rem;font-weight:800;color:var(--accent);letter-spacing:-.5px;font-variant-numeric:tabular-nums}

/* Share section */
.share-section{margin-top:0}
.share-label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-tertiary);text-align:center;margin-bottom:10px}

.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.share-btn{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:12px 4px;border:1.5px solid var(--border);
  background:var(--surface);border-radius:var(--radius-sm);
  cursor:pointer;transition:var(--transition);touch-action:manipulation;
  font-family:inherit;
}
.share-btn:active{transform:scale(.95);background:var(--bg)}
.share-btn svg{width:22px;height:22px}
.share-btn .s-label{font-size:.6rem;font-weight:600;color:var(--text-secondary);letter-spacing:-.1px}

.share-copy{
  width:100%;padding:13px;border:1.5px solid var(--border);
  background:var(--bg);border-radius:var(--radius-sm);
  font-family:inherit;font-size:.8rem;font-weight:600;
  color:var(--text);cursor:pointer;transition:var(--transition);
  touch-action:manipulation;display:flex;align-items:center;
  justify-content:center;gap:6px;
}
.share-copy:active{transform:scale(.98);background:var(--border-light)}
.share-copy svg{width:16px;height:16px;color:var(--text-secondary)}

/* Toast */
.toast{
  position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--accent);color:#fff;
  padding:10px 24px;border-radius:var(--radius-sm);
  font-size:.82rem;font-weight:600;letter-spacing:-.1px;
  opacity:0;transition:all .3s ease;pointer-events:none;z-index:200;
  box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

/* ===== SEEDED PRNG (Mulberry32) ===== */
function seedFromDate(){
  const d=new Date();
  const s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let h=0;
  for(let i=0;i<s.length;i++){h=Math.imul(31,h)+s.charCodeAt(i)|0}
  return h>>>0;
}
function mulberry32(a){
  return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
}

/* ===== GAME STATE ===== */
let lang='es';
let dailyItems=[];
let rng;
let selectedLeft=null;
let selectedRight=null;
let locked=false;
let matchCount=0;
let mistakes=0;
let timerStarted=false;
let timerInterval=null;
let seconds=0;
let sequence=[];
let alreadyCompleted=false;
const TODAY_KEY='ee_today';

/* ===== INIT ===== */
function init(){
  const seed=seedFromDate();
  rng=mulberry32(seed);

  const pool=[...Array(WORDS.length).keys()];
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  dailyItems=pool.slice(0,10).map(i=>WORDS[i]);

  renderDateHeader();
  checkTodayState();
  loadStreak();
  renderBoard();
  renderProgress();
  setupLangButtons();
  startCountdown();
}

function getDateStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function renderDateHeader(){
  const d=new Date();
  const opts={day:'numeric',month:'short',year:'numeric'};
  document.getElementById('headerDate').textContent=d.toLocaleDateString('es-ES',opts);
}

function checkTodayState(){
  try{
    const saved=JSON.parse(localStorage.getItem(TODAY_KEY));
    if(saved&&saved.date===getDateStr()&&saved.completed){
      matchCount=10;mistakes=saved.mistakes||0;seconds=saved.seconds||0;
      sequence=saved.sequence||[];
      timerStarted=true;alreadyCompleted=true;
      document.getElementById('timerVal').textContent=formatTime(seconds);
      document.getElementById('mistakeVal').textContent=mistakes;
      setTimeout(()=>showWinModal(),500);
    }
  }catch(e){}
}

/* ===== RENDER ===== */
function renderBoard(){
  const leftCol=document.getElementById('colLeft');
  const rightCol=document.getElementById('colRight');
  leftCol.innerHTML='';rightCol.innerHTML='';
  document.getElementById('colRightLabel').textContent=LANG_LABELS[lang];

  dailyItems.forEach((item,i)=>{
    leftCol.appendChild(makeTile(item.eus,i,'left'));
  });

  const rightOrder=dailyItems.map((item,i)=>({text:item[lang],idx:i}));
  const seed=seedFromDate();
  const rng2=mulberry32(seed);
  for(let i=0;i<100;i++) rng2();
  for(let i=rightOrder.length-1;i>0;i--){const j=Math.floor(rng2()*(i+1));[rightOrder[i],rightOrder[j]]=[rightOrder[j],rightOrder[i]]}

  rightOrder.forEach(obj=>{
    rightCol.appendChild(makeTile(obj.text,obj.idx,'right'));
  });

  if(matchCount===10){
    document.querySelectorAll('.tile').forEach(t=>t.classList.add('matched'));
  }
}

function makeTile(text,idx,side){
  const d=document.createElement('div');
  d.className='tile';
  d.textContent=text;
  d.dataset.idx=idx;
  d.dataset.side=side;
  d.addEventListener('click',()=>onTileClick(d));
  return d;
}

function renderProgress(){
  const c=document.getElementById('progress');
  c.innerHTML='';
  for(let i=0;i<10;i++){
    const pip=document.createElement('div');
    pip.className='pip';
    if(i<sequence.length) pip.classList.add(sequence[i]==='ok'?'ok':'miss');
    c.appendChild(pip);
  }
}

/* ===== LANGUAGE SWITCH ===== */
function setupLangButtons(){
  document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.dataset.lang===lang) return;
      document.querySelector('.lang-btn.active').classList.remove('active');
      btn.classList.add('active');
      lang=btn.dataset.lang;
      selectedLeft=null;selectedRight=null;
      clearSelections();
      renderBoard();
    });
  });
}

/* ===== TIMER ===== */
function startTimer(){
  if(timerStarted) return;
  timerStarted=true;
  timerInterval=setInterval(()=>{
    seconds++;
    document.getElementById('timerVal').textContent=formatTime(seconds);
  },1000);
}
function stopTimer(){clearInterval(timerInterval)}
function formatTime(s){
  const m=Math.floor(s/60);
  const sec=s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

/* ===== COUNTDOWN TO NEXT DAY ===== */
function startCountdown(){
  updateCountdown();
  setInterval(updateCountdown,1000);
}
function updateCountdown(){
  const el=document.getElementById('countdown');
  if(!el) return;
  const now=new Date();
  const tomorrow=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  const diff=tomorrow-now;
  const h=Math.floor(diff/3600000);
  const m=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);
  el.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/* ===== STREAK ===== */
function loadStreak(){
  try{
    const data=JSON.parse(localStorage.getItem('ee_streak'));
    if(data){
      const last=new Date(data.lastDate);
      const now=new Date();
      const diff=Math.floor((now-last)/(86400000));
      if(diff>1) data.count=0;
      document.getElementById('streakVal').textContent=data.count;
    }
  }catch(e){}
}
function incrementStreak(){
  let data={count:0,lastDate:''};
  try{const saved=JSON.parse(localStorage.getItem('ee_streak'));if(saved)data=saved}catch(e){}
  const today=getDateStr();
  if(data.lastDate===today) return data.count;
  const last=new Date(data.lastDate);
  const now=new Date(today);
  const diff=Math.floor((now-last)/86400000);
  data.count=(diff===1)?data.count+1:1;
  data.lastDate=today;
  localStorage.setItem('ee_streak',JSON.stringify(data));
  document.getElementById('streakVal').textContent=data.count;
  return data.count;
}

/* ===== GAME LOGIC ===== */
function onTileClick(tile){
  if(locked||tile.classList.contains('matched')) return;
  startTimer();

  const side=tile.dataset.side;
  if(side==='left'){
    if(selectedLeft) selectedLeft.classList.remove('selected');
    if(selectedLeft===tile){selectedLeft=null;return}
    selectedLeft=tile;tile.classList.add('selected');
  }else{
    if(selectedRight) selectedRight.classList.remove('selected');
    if(selectedRight===tile){selectedRight=null;return}
    selectedRight=tile;tile.classList.add('selected');
  }

  if(selectedLeft&&selectedRight){
    locked=true;
    const lIdx=parseInt(selectedLeft.dataset.idx);
    const rIdx=parseInt(selectedRight.dataset.idx);

    if(lIdx===rIdx){
      selectedLeft.classList.add('matched');
      selectedRight.classList.add('matched');
      selectedLeft.classList.remove('selected');
      selectedRight.classList.remove('selected');
      matchCount++;sequence.push('ok');renderProgress();
      selectedLeft=null;selectedRight=null;locked=false;
      if(matchCount===10) onWin();
    }else{
      mistakes++;sequence.push('miss');
      document.getElementById('mistakeVal').textContent=mistakes;
      renderProgress();
      selectedLeft.classList.add('wrong');
      selectedRight.classList.add('wrong');
      const sl=selectedLeft,sr=selectedRight;
      setTimeout(()=>{
        sl.classList.remove('wrong','selected');
        sr.classList.remove('wrong','selected');
        selectedLeft=null;selectedRight=null;locked=false;
      },500);
    }
  }
}

function clearSelections(){
  document.querySelectorAll('.tile.selected').forEach(t=>t.classList.remove('selected'));
}

/* ===== WIN STATE ===== */
function onWin(){
  stopTimer();
  incrementStreak();
  try{
    localStorage.setItem(TODAY_KEY,JSON.stringify({
      date:getDateStr(),completed:true,mistakes,seconds,sequence
    }));
  }catch(e){}
  alreadyCompleted=true;
  setTimeout(()=>showWinModal(),500);
}

function showWinModal(){
  let streak=0;
  try{const d=JSON.parse(localStorage.getItem('ee_streak'));if(d)streak=d.count}catch(e){}
  document.getElementById('mStreak').textContent=streak;
  document.getElementById('mTime').textContent=formatTime(seconds);
  document.getElementById('mMistakes').textContent=mistakes;

  const seqContainer=document.getElementById('mSeq');
  seqContainer.innerHTML='';
  sequence.forEach(s=>{
    const pip=document.createElement('div');
    pip.className='seq-pip '+(s==='ok'?'ok':'miss');
    seqContainer.appendChild(pip);
  });

  document.getElementById('overlay').classList.add('show');
}

/* ===== SHARE HELPERS ===== */
function getShareText(){
  let streak=0;
  try{const d=JSON.parse(localStorage.getItem('ee_streak'));if(d)streak=d.count}catch(e){}
  const blocks=sequence.map(s=>s==='ok'?'\u2588':'\u2591').join('');
  return `Euskara Egunero ${getDateStr()}\nRacha: ${streak} | Tiempo: ${formatTime(seconds)} | Errores: ${mistakes}\n${blocks}`;
}

function shareToUrl(baseUrl,params){
  const url=new URL(baseUrl);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  window.open(url.toString(),'_blank','noopener,noreferrer');
}

// X (Twitter)
document.getElementById('shareX').addEventListener('click',()=>{
  shareToUrl('https://x.com/intent/tweet',{text:getShareText()});
});

// Facebook
document.getElementById('shareFB').addEventListener('click',()=>{
  const text=getShareText();
  shareToUrl('https://www.facebook.com/sharer/sharer.php',{quote:text});
});

// WhatsApp
document.getElementById('shareWA').addEventListener('click',()=>{
  shareToUrl('https://api.whatsapp.com/send',{text:getShareText()});
});

// Mastodon — prompt for instance
document.getElementById('shareMD').addEventListener('click',()=>{
  const instance=prompt('Tu instancia de Mastodon (ej: mastodon.social):');
  if(!instance) return;
  const host=instance.replace(/^https?:\/\//,'').replace(/\/$/,'');
  shareToUrl(`https://${host}/share`,{text:getShareText()});
});

// Copy to clipboard
document.getElementById('shareCopy').addEventListener('click',()=>{
  const text=getShareText();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showToast).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
});

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showToast()}catch(e){}
  document.body.removeChild(ta);
}

function showToast(){
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

/* Close modal on overlay click */
document.getElementById('overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('show');
});

/* ===== START ===== */
init();
</script>
